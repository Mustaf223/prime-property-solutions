<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prime Property Solutions | The Gambia</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      color: #222;
      line-height: 1.6;
      background: #f7f8f7;
    }

    header {
      background: #0b3d2e;
      color: white;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-container {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      color: #d4a017;
      font-size: 22px;
      font-weight: bold;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      color: #d4a017;
    }

    .hero {
      min-height: 520px;
      display: flex;
      align-items: center;
      text-align: center;
      color: white;
      padding: 70px 20px;

      background:
        linear-gradient(rgba(11,61,46,0.78), rgba(11,61,46,0.78)),
        url("https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=1600&q=80");

      background-size: cover;
      background-position: center;
    }

    .hero-content {
      max-width: 850px;
      margin: auto;
    }

    .hero h1 {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 19px;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-block;
      padding: 13px 22px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
    }

    .gold-btn {
      background: #d4a017;
      color: #111;
    }

    .white-btn {
      background: white;
      color: #0b3d2e;
    }

    section {
      padding: 55px 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      color: #0b3d2e;
      margin-bottom: 12px;
      font-size: 30px;
    }

    .section-text {
      text-align: center;
      max-width: 750px;
      margin: 0 auto 35px;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .service-card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .service-card h3 {
      color: #0b3d2e;
      margin-bottom: 8px;
    }

    .market {
      background: #0b3d2e;
      color: white;
    }

    .market .section-title {
      color: #d4a017;
    }

    .market-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .market-card {
      background: white;
      color: #222;
      padding: 25px;
      border-radius: 10px;
      text-align: center;
    }

    .market-card h3 {
      color: #0b3d2e;
      margin-bottom: 10px;
    }

    .market-card a {
      display: inline-block;
      margin-top: 12px;
      background: #d4a017;
      color: #111;
      padding: 10px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }

    .why {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .why-card {
      background: white;
      padding: 25px;
      border-left: 4px solid #d4a017;
      border-radius: 8px;
    }

    .cta {
      background: #d4a017;
      text-align: center;
      padding: 55px 20px;
    }

    .cta h2 {
      color: #0b3d2e;
      margin-bottom: 10px;
    }
